<div class="py-4">
  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="app-col-4">
    <div class="app-col-4 pb-4">
      <app-section>
        <span sectionHeader>Transfer Window</span>
        <div class="flex flex-col sm:flex-row gap-4">
          <app-input-datetime
            property="datetime"
            label="Datetime"
            [required]="true"
            class="app-fill"
          />
          <app-input-number
            property="transferDayDelay"
            label="Transfer day delay"
            [required]="true"
            class="app-fill"
          />
        </div>
      </app-section>

      <app-button-submit
        [form]="form"
        [working]="isLoading"
        label="Create transfer window"
        class="pt-4 md:w-1/2 md:ml-auto"
      />
    </div>
  </form>
</div>
