<div class="app-user-session flex items-center justify-center sm:h-full">
  @if (userSession.loggedIn()) {
    <button (click)="userActionService.open()" class="cursor-pointer" type="button">
      <app-avatar resource="d11-team" [id]="d11TeamId()" />
    </button>
  } @else {
    <button type="button" class="cursor-pointer flex items-center opacity-75" (click)="onLogin()">
      <app-svg-icon name="person" />
    </button>
  }
</div>

<app-user-action-drawer />
