<div class="app-row justify-center sm:h-full">
  @if (userSession.loggedIn()) {
    <button (click)="userActionService.open()" class="app-button" type="button">
      <app-avatar resource="d11-team" [id]="d11TeamId()" />
    </button>
  } @else {
    <button type="button" class="app-button-icon" (click)="onLogin()">
      <app-svg-icon name="person" />
    </button>
  }
</div>

<app-user-action-drawer />
