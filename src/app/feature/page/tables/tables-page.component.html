<div class="app-row bg-primary text-primary-contrast rounded-sm p-2">
  <button
    (click)="onLiveClick()"
    class="px-2 py-1 rounded-sm app-text-header border-none cursor-pointer outline-none min-w-12 h-9.5"
    type="button"
  >
    Live
  </button>

  <app-season-scroll-picker
    class="min-w-0"
    [seasonId]="seasonId()"
    (seasonSelected)="onSeasonSelected($event)"
  />

  @if (seasonId(); as selectedId) {
    <app-season-picker-button [seasonId]="selectedId" (seasonSelected)="onSeasonSelected($event)" />
  }
</div>

<div class="app-responsive pt-7">
  @if (seasonId(); as id) {
    <app-team-season-stats-section [seasonId]="id" />
    <app-d11-team-season-stats-section [seasonId]="id" />
  }
</div>
