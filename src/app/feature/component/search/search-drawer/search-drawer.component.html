<div
  class="app-search-drawer-backdrop fixed inset-0 z-50 bg-black/50 transition-opacity duration-200"
  [class]="visible() ? 'opacity-100' : 'opacity-0 pointer-events-none'"
  (click)="onClose()"
></div>

<div
  class="app-search-drawer fixed top-0 left-0 right-0 z-50 bg-surface-50 transition-transform duration-200 rounded-b-[25px]"
  [class]="visible() ? 'shadow-lg translate-y-0' : '-translate-y-full'"
>
  <div class="app-row gap-3 bg-primary p-4">
    <div class="relative flex-1">
      <div class="absolute left-3 top-1/2 -translate-y-1/2">
        <app-svg-icon
          name="search"
          class="app-text-secondary absolute left-3 top-1/2 -translate-y-1/2"
        />
      </div>
      <input
        #searchInput
        pInputText
        type="text"
        placeholder="Search players..."
        class="w-full rounded-full! pl-10! max-h-12"
        [value]="value()"
        (input)="onInput($event)"
      />
    </div>
    <button class="app-text-section primary-contrast" (click)="onClose()">Close</button>
  </div>

  <div
    class="bg-surface-50 text-surface-900!"
    [ngClass]="results().length > 0 ? 'inline' : 'hidden'"
  >
    <div class="p-4">
      <ul class="app-col gap-2 max-h-[70vh] overflow-y-auto">
        @for (player of results(); track player.id) {
          <li class="app-row gap-4 px-2" (click)="select(player)">
            <app-avatar resource="player" [id]="player.id" size="large" />
            <div>
              <span class="app-text-primary">{{ player.name }}</span>
              @if (player.teamId > 1) {
                <span class="app-text-section-detail block">{{ player.teamName }}</span>
              }
            </div>
          </li>
        }
      </ul>
    </div>
  </div>
</div>
