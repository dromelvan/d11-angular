<div class="grid grid-cols-[auto_1fr_auto_auto_auto] gap-x-2">
  @for (group of groups(); track group.date; let first = $first) {
    <div [class.pb-4]="first" [class.py-4]="!first" class="app-text-primary col-span-5">
      {{
        group.date === Status.POSTPONED
          ? (Status.POSTPONED | titlecase)
          : (group.date | safeDate: 'EEEE, MMMM d')
      }}
    </div>
    @for (d11Match of group.matches; track d11Match.id; let first = $first; let last = $last) {
      <app-d11-match-result-col
        [d11Match]="d11Match"
        [isLast]="last"
        [class.pt-2]="!first"
        [class.pb-2]="!last"
      />
      @if (!last) {
        <div class="app-separator col-span-5"></div>
      }
    }
  }
</div>
