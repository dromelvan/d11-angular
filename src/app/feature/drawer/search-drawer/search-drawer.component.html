<div
  data-testid="search-drawer-backdrop"
  class="fixed inset-0 z-50 bg-black/50 transition-opacity duration-200"
  [class]="visible() ? 'opacity-100' : 'opacity-0 pointer-events-none'"
  (click)="onClose()"
></div>

<div
  data-testid="search-drawer"
  class="fixed top-0 left-0 right-0 z-50 bg-surface-50 transition-transform duration-200 rounded-b-[25px]"
  [class]="visible() ? 'shadow-lg translate-y-0' : '-translate-y-full'"
>
  <div class="app-row-3 bg-primary p-4">
    <div class="relative flex-1">
      <div class="absolute left-3 top-1/2 -translate-y-1/2">
        <app-svg-icon name="search" class="text-surface-500" />
      </div>
      <input
        #searchInput
        pInputText
        type="text"
        placeholder="Search players..."
        class="w-full rounded-full! pl-10! max-h-12"
        [value]="value()"
        (input)="onInput($event)"
      />
    </div>
    <button class="app-text-primary text-primary-contrast" (click)="onClose()">Close</button>
  </div>

  <div [ngClass]="results().length > 0 ? 'inline' : 'hidden'">
    <ul class="app-col-2 app-text-drawer p-4">
      @for (player of results(); track player.id) {
        <li class="app-row-4 px-2" (click)="select(player)">
          <app-avatar resource="player" [id]="player.id" size="large" />
          <div>
            <span class="app-text-title">{{ player.name }}</span>
            @if (player.teamId > 1) {
              <span class="app-text-detail block">{{ player.teamName }}</span>
            }
          </div>
        </li>
      }
    </ul>
  </div>
</div>
